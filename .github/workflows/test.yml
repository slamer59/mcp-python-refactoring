name: Tests

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        # test_analyzer_memory_cleanup snapshots the shared temp dir and fails when
        # xdist workers concurrently create .py files there (see test.yml report).
        run: >-
          uv run pytest -n auto
          --deselect tests/test_security_performance_and_edge_cases.py::TestSecurityPerformanceAndEdgeCases::test_analyzer_memory_cleanup
